services:
  mysql:
    image: mysql:8.0
    container_name: oncall-agent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oncall_agent
      MYSQL_USER: oncall
      MYSQL_PASSWORD: oncall
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: